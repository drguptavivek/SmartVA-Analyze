name: Rust SmartVA CI & Multi-Arch Release Binaries

on:
  push:
    branches:
      - rust
      - main
    tags:
      - "v*"
      - "rust-v*"
  pull_request:
    branches:
      - rust
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: smartva-rs-linux-amd64
            bin_name: smartva-rs
            lib_name: libsmartva_rust.so
            apt_packages: libfontconfig1-dev pkg-config

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: smartva-rs-linux-arm64
            bin_name: smartva-rs
            lib_name: libsmartva_rust.so
            apt_packages: libfontconfig1-dev pkg-config

          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: smartva-rs-macos-arm64
            bin_name: smartva-rs
            lib_name: libsmartva_rust.dylib
            apt_packages: ""

          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: smartva-rs-macos-amd64
            bin_name: smartva-rs
            lib_name: libsmartva_rust.dylib
            apt_packages: ""

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: smartva-rs-windows-amd64
            bin_name: smartva-rs.exe
            lib_name: smartva_rust.dll
            apt_packages: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          key: ${{ matrix.target }}

      - name: Build release binary & C-ABI shared library
        working-directory: rust
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Run unit tests (native host targets)
        if: matrix.target != 'x86_64-apple-darwin'
        working-directory: rust
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Smoke test CLI (--version, --list-countries, and --json)
        if: matrix.target != 'x86_64-apple-darwin'
        working-directory: rust
        shell: bash
        run: |
          ./target/${{ matrix.target }}/release/${{ matrix.bin_name }} --version
          ./target/${{ matrix.target }}/release/${{ matrix.bin_name }} --list-countries > /dev/null
          ./target/${{ matrix.target }}/release/${{ matrix.bin_name }} --country IND --json '{"sid":"VA-CI-001","Id10013":"yes","Id10019":"male","ageInYears":62,"Id10147":"yes"}' --format json > /dev/null

      - name: Package release archive
        working-directory: rust
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/${{ matrix.artifact_name }}/
          cp target/${{ matrix.target }}/release/${{ matrix.lib_name }} dist/${{ matrix.artifact_name }}/
          cp README.md WHITEPAPER.md OPTIMIZATIONS.md dist/${{ matrix.artifact_name }}/
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip ${{ matrix.artifact_name }}.zip ${{ matrix.artifact_name }}
          else
            tar -czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}
          fi

      - name: Upload build artifact (${{ matrix.artifact_name }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            rust/dist/${{ matrix.artifact_name }}.tar.gz
            rust/dist/${{ matrix.artifact_name }}.zip
          if-no-files-found: error
